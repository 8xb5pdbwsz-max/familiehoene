<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Familie Höne – Verwaltung</title>
  <meta name="description" content="Verwaltung Höne – Kontakt">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f3a34'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='32' fill='%23e9dcc3' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f1ea;
      --card: #fffdf9;
      --ink: #1f2a27;
      --muted: #6b716d;
      --green: #1f3a34;
      --brass: #a8865a;
      --line: #e4ddd0;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 560px; flex: 1; padding: 9vh 0 48px; }
    header { text-align: center; margin-bottom: 40px; }
    .mono {
      width: 64px; height: 64px; margin: 0 auto 22px;
      border-radius: 50%;
      border: 1px solid var(--brass);
      display: grid; place-items: center;
      font-family: var(--serif); font-size: 30px; color: var(--green);
      box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 5px var(--line);
    }
    .eyebrow {
      font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--brass); margin: 0 0 6px;
    }
    h1 {
      font-family: var(--serif); font-weight: 400;
      font-size: clamp(36px, 8vw, 48px); line-height: 1.1;
      color: var(--green); margin: 0;
    }
    .rule { width: 48px; height: 1px; background: var(--brass); margin: 26px auto 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 32px 32px 28px;
      box-shadow: 0 1px 2px rgba(31,58,52,.04), 0 12px 32px -12px rgba(31,58,52,.12);
    }
    .label {
      font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 18px;
    }
    address { font-style: normal; font-family: var(--serif); font-size: 20px; line-height: 1.55; }
    address strong { font-weight: 400; color: var(--green); }
    .sep { height: 1px; background: var(--line); margin: 24px 0 20px; }
    .mail { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
    .mail svg { flex: none; color: var(--brass); }
    .mail span { border-bottom: 1px solid transparent; transition: border-color .2s; }
    a.mail:hover span { border-color: var(--brass); }
    .tenant {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin-top: 20px; padding: 18px 22px;
      border: 1px solid var(--line); border-radius: 14px;
      background: transparent; color: var(--green); text-decoration: none;
      transition: background .2s, border-color .2s;
    }
    .tenant:hover { background: var(--card); border-color: var(--brass); }
    .tenant .t { display: flex; align-items: center; gap: 14px; }
    .tenant small { display: block; color: var(--muted); font-size: 14px; }
    .tenant b { font-weight: 600; font-size: 16px; }
    .tenant .arrow { color: var(--brass); font-size: 20px; transition: transform .2s; }
    .tenant:hover .arrow { transform: translateX(3px); }
    footer { padding: 24px 0 32px; font-size: 13px; color: var(--muted); text-align: center; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--green); }
    @media (max-width: 480px) {
      .card { padding: 26px 22px 22px; }
      address { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mono" aria-hidden="true">H</div>
      <p class="eyebrow">Verwaltung</p>
      <h1>Familie Höne</h1>
      <div class="rule"></div>
    </header>

    <section class="card" aria-labelledby="kontakt">
      <p class="label" id="kontakt">Kontakt und Verantwortlicher i.&nbsp;S.&nbsp;d. DSGVO</p>
      <address>
        <strong>Verwaltung Höne</strong><br>
        Familie Höne<br>
        Hellstr. 20<br>
        48231 Warendorf
      </address>
      <div class="sep"></div>
      <a class="mail" id="mail" href="#">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></svg>
        <span>verwaltung [at] familiehoene.de</span>
      </a>
    </section>

    <a class="tenant" href="kontakt.html">
      <span class="t">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
        <span><b>Informationen für Mieter</b><small>Passwortgeschützter Bereich</small></span>
      </span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <footer>© Familie Höne · <a href="datenschutz.html">Datenschutz</a></footer>

  <script>
    // E-Mail-Adresse erst im Browser zusammensetzen (Schutz vor Spam-Bots)
    document.getElementById('mail').addEventListener('click', function (e) {
      e.preventDefault();
      location.href = 'mailto:' + ['verwaltung', 'familiehoene.de'].join('@');
    });
  </script>
  <img src="https://famhoene.goatcounter.com/count?p=/" alt="" width="1" height="1" style="position:absolute;left:-9999px">
</body>
</html>
